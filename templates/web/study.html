{% extends "app.html" %}
{% load static %}
{% block title %}Учёба{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Study 📚</h1>
    <nav class="chips" aria-label="Разделы">
        <a class="chip" href="#subjects">Предметы</a>
        <a class="chip" href="#deadlines">Дедлайны</a>
        <a class="chip" href="#schedule">Расписание</a>
    </nav>
</div>

<div class="grid-2">
    <section class="card" id="subjects" aria-labelledby="subjects-title">
        <h2 id="subjects-title">Предметы</h2>
        <form id="subject-form" novalidate>
            <div class="field-row">
                <div class="field" style="flex:2 1 180px">
                    <label for="subject-name">Название</label>
                    <input type="text" id="subject-name" name="name" maxlength="100" required>
                </div>
                <div class="field" style="flex:0 0 auto">
                    <label for="subject-color">Цвет</label>
                    <input type="color" id="subject-color" name="color" value="#FF0080">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="subject-teacher">Преподаватель</label>
                    <input type="text" id="subject-teacher" name="teacher" maxlength="150">
                </div>
                <div class="field">
                    <label for="subject-room">Кабинет</label>
                    <input type="text" id="subject-room" name="room" maxlength="50">
                </div>
            </div>
            <p class="form-error" role="alert"></p>
            <div class="dialog-actions">
                <button type="button" class="btn ghost" data-cancel hidden>Отмена</button>
                <button type="submit" class="btn">Добавить предмет</button>
            </div>
        </form>
        <ul class="list" id="subject-list" style="margin-top:8px"></ul>
    </section>

    <section class="panel" id="deadlines" aria-labelledby="deadlines-title">
        <h2 id="deadlines-title">Дедлайны и экзамены ⏰</h2>
        <div id="upcoming" style="margin-bottom:10px"></div>
        <form id="deadline-form" novalidate>
            <div class="field">
                <label for="deadline-title">Что сдаём</label>
                <input type="text" id="deadline-title" name="title" maxlength="200" required>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="deadline-kind">Тип</label>
                    <select id="deadline-kind" name="kind">
                        <option value="exam">Экзамен</option>
                        <option value="test">Зачёт</option>
                        <option value="coursework">Курсовая</option>
                        <option value="homework">ДЗ</option>
                    </select>
                </div>
                <div class="field">
                    <label for="deadline-date">Дата</label>
                    <input type="date" id="deadline-date" name="due_date" required>
                </div>
                <div class="field">
                    <label for="deadline-subject">Предмет</label>
                    <select id="deadline-subject" name="subject" required></select>
                </div>
            </div>
            <p class="form-error" role="alert"></p>
            <div class="dialog-actions">
                <button type="button" class="btn ghost" data-cancel hidden>Отмена</button>
                <button type="submit" class="btn">Добавить дедлайн</button>
            </div>
        </form>
        <ul class="list" id="deadline-list" style="margin-top:8px"></ul>
    </section>
</div>

<section class="panel" id="schedule" aria-labelledby="schedule-title" style="margin-top:16px">
    <h2 id="schedule-title">Расписание недели</h2>
    <form id="slot-form" class="field-row" novalidate style="align-items:flex-end">
        <div class="field">
            <label for="slot-subject">Предмет</label>
            <select id="slot-subject" name="subject" required></select>
        </div>
        <div class="field">
            <label for="slot-weekday">День</label>
            <select id="slot-weekday" name="weekday">
                <option value="0">Понедельник</option>
                <option value="1">Вторник</option>
                <option value="2">Среда</option>
                <option value="3">Четверг</option>
                <option value="4">Пятница</option>
                <option value="5">Суббота</option>
            </select>
        </div>
        <div class="field">
            <label for="slot-start">Начало</label>
            <input type="time" id="slot-start" name="start_time" value="09:00" required>
        </div>
        <div class="field">
            <label for="slot-end">Конец</label>
            <input type="time" id="slot-end" name="end_time" value="10:30" required>
        </div>
        <div class="field" style="flex:0 0 auto">
            <button type="submit" class="btn">Добавить пару</button>
        </div>
        <p class="form-error" role="alert" style="flex-basis:100%"></p>
    </form>
    <div class="scroll-x"><div class="week-grid" id="week-grid"></div></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/study.js' %}"></script>
{% endblock %}

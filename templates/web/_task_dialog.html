{% comment %}Edit-task window, used by tasks.js on the Today, Month and Tasks pages.{% endcomment %}
<dialog id="task-dialog" aria-labelledby="task-dialog-title">
    <form id="task-edit-form" novalidate>
        <h2 id="task-dialog-title">Задача 💗</h2>
        <div class="field">
            <label for="edit-title">Название</label>
            <input type="text" id="edit-title" name="title" maxlength="200" required>
        </div>
        <div class="field">
            <label for="edit-description">Описание</label>
            <textarea id="edit-description" name="description" rows="3"></textarea>
        </div>
        <div class="field-row">
            <div class="field">
                <label for="edit-date">Дата</label>
                <input type="date" id="edit-date" name="date" required>
            </div>
            <div class="field">
                <label for="edit-priority">Приоритет</label>
                <select id="edit-priority" name="priority">
                    <option value="low">🌸 низкий</option>
                    <option value="mid">🌷 средний</option>
                    <option value="high">🌹 высокий</option>
                </select>
            </div>
        </div>
        <div class="field">
            <label for="edit-subject">Предмет</label>
            <select id="edit-subject" name="subject"></select>
        </div>
        <p class="form-error" role="alert"></p>
        <div class="dialog-actions">
            <button type="button" class="btn ghost" data-close>Отмена</button>
            <button type="submit" class="btn">Сохранить</button>
        </div>
    </form>
</dialog>

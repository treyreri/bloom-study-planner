{% extends "app.html" %}
{% load static %}
{% block title %}Привычки{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Habits ✨</h1>
    <div class="chips" role="group" aria-label="Выбор месяца">
        <button type="button" class="chip" id="prev-month" aria-label="Предыдущий месяц">←</button>
        <strong id="month-label" aria-live="polite" style="min-width:9em;text-align:center;align-self:center"></strong>
        <button type="button" class="chip" id="next-month" aria-label="Следующий месяц">→</button>
    </div>
</div>

<section class="card" aria-labelledby="new-habit-title">
    <h2 id="new-habit-title" class="visually-hidden">Новая привычка</h2>
    <form id="habit-form" novalidate>
        <div class="capsule">
            <label for="habit-emoji" class="visually-hidden">Эмодзи</label>
            <select id="habit-emoji" name="emoji" style="flex:0 0 auto;width:auto;border:0;background:transparent;border-radius:999px">
                <option>🌷</option><option>💧</option><option>🏃‍♀️</option><option>📖</option>
                <option>🇫🇷</option><option>🧘‍♀️</option><option>🍎</option><option>😴</option><option>✍️</option>
            </select>
            <label for="habit-title" class="visually-hidden">Название привычки</label>
            <input type="text" id="habit-title" name="title" maxlength="150" placeholder="Выпить 8 стаканов воды" autocomplete="off">
            <button type="submit" class="btn">Добавить</button>
        </div>
        <p class="form-error" role="alert"></p>
    </form>
</section>

<section class="panel" aria-labelledby="grid-title" style="margin-top:16px">
    <h2 id="grid-title" class="visually-hidden">Сетка привычек</h2>
    <div class="scroll-x" id="habit-grid"></div>
    <p class="small muted" style="margin:10px 0 0">Нажми на сердечко, чтобы отметить день. Будущие дни отметить нельзя.</p>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/habits.js' %}"></script>
{% endblock %}

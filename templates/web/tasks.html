{% extends "app.html" %}
{% load static %}
{% block title %}Задачи{% endblock %}

{% block content %}
<div id="tasks-page">
    <div class="page-head">
        <h1>To-do List 🌷</h1>
        <p class="muted" id="tasks-summary" aria-live="polite"></p>
    </div>

    <div class="grid" style="grid-template-columns:minmax(0,1fr)">
        <section class="card" aria-labelledby="add-title">
            <h2 id="add-title" class="visually-hidden">Новая задача</h2>
            <form id="task-add" novalidate>
                <div class="capsule">
                    <label for="add-title-input" class="visually-hidden">Название задачи</label>
                    <input type="text" id="add-title-input" name="title" maxlength="200" placeholder="Что нужно сделать?" autocomplete="off">
                    <button type="submit" class="btn">Добавить</button>
                </div>
                <div class="field-row" style="margin-top:10px">
                    <div class="field">
                        <label for="add-date">Дата</label>
                        <input type="date" id="add-date" name="date">
                    </div>
                    <div class="field">
                        <label for="add-priority">Приоритет</label>
                        <select id="add-priority" name="priority">
                            <option value="low">🌸 низкий</option>
                            <option value="mid" selected>🌷 средний</option>
                            <option value="high">🌹 высокий</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="add-subject">Предмет</label>
                        <select id="add-subject" name="subject"></select>
                    </div>
                </div>
                <p class="form-error" role="alert"></p>
            </form>

            <div class="chips" role="group" aria-label="Какие задачи показать" style="margin:6px 0 10px">
                <button type="button" class="chip" data-view="today" aria-pressed="true">Сегодня</button>
                <button type="button" class="chip" data-view="week" aria-pressed="false">Неделя</button>
                <button type="button" class="chip" data-view="overdue" aria-pressed="false">Просроченные</button>
                <button type="button" class="chip" data-view="all" aria-pressed="false">Все</button>
            </div>

            <form id="task-filters" class="field-row" role="search">
                <div class="field">
                    <label for="filter-search">Поиск</label>
                    <input type="search" id="filter-search" name="search" placeholder="по названию">
                </div>
                <div class="field">
                    <label for="filter-subject">Предмет</label>
                    <select id="filter-subject" name="subject"></select>
                </div>
                <div class="field">
                    <label for="filter-priority">Приоритет</label>
                    <select id="filter-priority" name="priority">
                        <option value="">Любой</option>
                        <option value="low">🌸 низкий</option>
                        <option value="mid">🌷 средний</option>
                        <option value="high">🌹 высокий</option>
                    </select>
                </div>
                <div class="field">
                    <label for="filter-ordering">Сортировка</label>
                    <select id="filter-ordering" name="ordering">
                        <option value="">По дате</option>
                        <option value="-priority">Сначала важные</option>
                        <option value="-date">Сначала поздние</option>
                    </select>
                </div>
            </form>

            <ul class="task-list" id="task-list" aria-live="polite"></ul>
            <div style="text-align:center;margin-top:10px">
                <button type="button" class="btn secondary" id="load-more" hidden>Показать ещё</button>
            </div>
        </section>
    </div>
</div>
{% include "web/_task_dialog.html" %}
{% endblock %}

{% block scripts %}
<script src="{% static 'js/tasks.js' %}"></script>
{% endblock %}

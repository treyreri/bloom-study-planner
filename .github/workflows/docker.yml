# Builds the two images that change with the code and pushes them to GHCR as
# multi-arch images (linux/amd64 + linux/arm64), so the server only pulls them
# (it has too little disk to build).
#   ghcr.io/treyreri/bloom-muna-backend:latest  / :<commit sha>
#   ghcr.io/treyreri/bloom-muna-frontend:latest / :<commit sha>
#
# Each platform is built natively on its own runner (no QEMU emulation) and
# pushed by digest; the merge job then joins the digests under the two tags.
name: Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/treyreri

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [bloom-muna-backend, bloom-muna-frontend]
        arch: [amd64, arm64]
        include:
          - image: bloom-muna-backend
            context: .
          - image: bloom-muna-frontend
            context: ./frontend
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          # links the package to this repository on GitHub
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Save the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} (multi-arch tags)
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [bloom-muna-backend, bloom-muna-frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the latest and SHA tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${{ env.REGISTRY }}/${{ matrix.image }}"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$image:latest" -t "$image:${{ github.sha }}" \
            $(printf "$image@sha256:%s " *)

      - name: Show the platforms
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ matrix.image }}:latest"

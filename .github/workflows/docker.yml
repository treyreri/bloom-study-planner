# Builds the two images that change with the code and pushes them to GHCR,
# so the server only pulls them (it has too little disk to build).
#   ghcr.io/treyreri/bloom-muna-backend:latest  / :<commit sha>
#   ghcr.io/treyreri/bloom-muna-frontend:latest / :<commit sha>
name: Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bloom-muna-backend
            context: .
          - image: bloom-muna-frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/treyreri/${{ matrix.image }}:latest
            ghcr.io/treyreri/${{ matrix.image }}:${{ github.sha }}
          # links the package to this repository on GitHub
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

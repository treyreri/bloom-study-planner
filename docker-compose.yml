# Bloom Planner: browser → nginx-frontend → nginx-backend → gunicorn/Django → PostgreSQL
# Start:  docker compose up --build      then open http://localhost
# Values come from .env (see .env.example); the defaults suit a local run.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bloom}
      POSTGRES_USER: ${DB_USER:-bloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bloom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bloom} -d ${DB_NAME:-bloom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      TIME_ZONE: ${TIME_ZONE:-Europe/Moscow}
      DB_NAME: ${DB_NAME:-bloom}
      DB_USER: ${DB_USER:-bloom}
      DB_PASSWORD: ${DB_PASSWORD:-bloom}
      DB_HOST: db
      DB_PORT: "5432"
      # local http://localhost: no HTTPS redirect, cookies also over http
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_COOKIES: ${SECURE_COOKIES:-False}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx-backend:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_django.inc:/etc/nginx/conf.d/proxy_django.inc:ro
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
    depends_on:
      - backend

  nginx-frontend:
    build: ./frontend
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"          # the only published port
    depends_on:
      - nginx-backend

volumes:
  postgres_data:
  static_files:
  media_files:

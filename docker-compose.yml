# Bloom Planner: browser → (server nginx, HTTPS) → nginx-frontend → nginx-backend → gunicorn/Django → PostgreSQL
#
# Shared server: everything is prefixed with the project name "bloom-muna"
# (containers, volumes, network), and the only published port is 127.0.0.1:8038.
# Server: images are prebuilt by GitHub Actions (.github/workflows/docker.yml) and pulled:
#         sudo docker compose pull backend nginx-frontend && sudo docker compose up -d --no-build
# Local:  docker compose up --build                 (see DEPLOY.md)
# Values come from .env (see .env.example / DEPLOY.md).

name: bloom-muna

# small rotating logs: Docker's default log files grow without limit
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:-bloom}
      POSTGRES_USER: ${DB_USER:-bloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bloom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bloom} -d ${DB_NAME:-bloom}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/treyreri/bloom-muna-backend:latest   # built by GitHub Actions; the server only pulls it
    build: .                                             # used by a local `docker compose up --build`
    restart: unless-stopped
    logging: *logging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      TIME_ZONE: ${TIME_ZONE:-Europe/Moscow}
      DB_NAME: ${DB_NAME:-bloom}
      DB_USER: ${DB_USER:-bloom}
      DB_PASSWORD: ${DB_PASSWORD:-bloom}
      DB_HOST: db
      DB_PORT: "5432"
      # HTTPS is terminated by the server's own nginx; Django trusts its X-Forwarded-Proto
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_COOKIES: ${SECURE_COOKIES:-False}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx-backend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_django.inc:/etc/nginx/conf.d/proxy_django.inc:ro
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
    depends_on:
      - backend

  nginx-frontend:
    image: ghcr.io/treyreri/bloom-muna-frontend:latest  # built by GitHub Actions; the server only pulls it
    build: ./frontend                                    # used by a local `docker compose up --build`
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8038:80"          # the only published port, localhost only (server nginx proxies to it)
    depends_on:
      - nginx-backend

volumes:
  postgres_data:
  static_files:
  media_files:

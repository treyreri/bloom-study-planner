# nginx-frontend: the only published container (127.0.0.1:8038).
# Serves the React build and forwards API/admin/static/media to nginx-backend.
# On the server, the host's own nginx terminates HTTPS and proxies to it.

# Keep the scheme/host sent by the server's nginx (https, medhub.softclub.tj);
# without that header (local test) use our own. Safe: the port only listens on 127.0.0.1.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 5m;          # avatar uploads pass through here first

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed build files (index-AbC123.js): cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be fresh, so a new build is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: every page URL (/today/, /month/?year=…) gets index.html
    location / {
        try_files $uri /index.html;
    }

    # everything Django serves goes to nginx-backend
    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://nginx-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

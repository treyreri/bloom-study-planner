# nginx-frontend: the only public server.
# Serves the React build and forwards API/admin/static/media to nginx-backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 5m;          # avatar uploads pass through here first

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed build files (index-AbC123.js): cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be fresh, so a new build is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: every page URL (/today/, /month/?year=…) gets index.html
    location / {
        try_files $uri /index.html;
    }

    # everything Django serves goes to nginx-backend
    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://nginx-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

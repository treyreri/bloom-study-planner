# nginx-backend: in front of Django/gunicorn.
# Receives /api/, /admin/, /static/ and /media/ from nginx-frontend.

upstream django {
    server backend:8000;
}

# keep the client's original scheme/host when the request comes from nginx-frontend
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;          # avatar uploads (the API allows up to 2 MB)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # collected static files of the admin and Swagger (python manage.py collectstatic)
    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # uploaded avatars
    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    location /api/ {
        include /etc/nginx/conf.d/proxy_django.inc;
    }

    location /admin/ {
        include /etc/nginx/conf.d/proxy_django.inc;
    }

    location / {
        return 404;
    }
}
